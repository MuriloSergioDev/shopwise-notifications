# Values for shopwise-platform/charts/laravel-service. `name` and `image` are set by the Tiltfile.
http:
  workers: 1
consumers:
  # Every event that causes a mail, plus customer-registered for the customers read model.
  - name: mails
    topics: [identity.customer-registered, orders.order-placed, orders.order-shipped, orders.order-cancelled, payments.refunded]
scheduler:
  enabled: true
queue:
  # Runs the SendMail jobs (database queue).
  enabled: true
# Topics this service owns (it is the only producer): none.
topics: []
env:
  LOG_CHANNEL: stderr
  OCTANE_SERVER: frankenphp
  MAIL_FROM_ADDRESS: hello@shopwise.test
  MAIL_FROM_NAME: Shopwise
  STOREFRONT_URL: http://localhost:3000
